isible por 4.","rule_revised-julian":"Como el juliano, pero los siglos son bisiestos solo si el resto módulo 900 es 200 o 600.","rule_hebrew":"Ciclo de 19 años con 7 bisiestos (un segundo Adar); longitud del año según las reglas de aplazamiento (dehiyyot).","rule_hijri":"Ciclo de 30 años con 11 bisiestos (2, 5, 7, 10, 13, 16, 18, 21, 24, 26, 29); meses alternos de 30 y 29 días.","rule_persian":"El año empieza el día del equinoccio de marzo si ocurre antes del mediodía en Teherán, si no, al día siguiente; el último mes tiene 29 o 30 días.","rule_coptic":"Bisiesto si el año módulo 4 es 3 (un sexto día epagómeno).","rule_ethiopian":"Bisiesto si el año módulo 4 es 3 (Pagume tiene 6 días).","rule_chinese":"Luna nueva astronómica (Pekín); el mes 11 contiene el solsticio de invierno; en un año de 13 meses, el primer mes sin término solar principal es el intercalar.","rule_maya":"Cuenta de días: 1 baktún = 144 000 días; Tzolk’in de 260 días; Haab’ de 365 días (18 × 20 + 5).","rule_mars":"Un sol = 1,0274912517 días terrestres; cuenta continua, sin meses.","h_limits":"Límites, dichos con claridad","lim_1":"El calendario hégira es el TABULAR (aritmético); el observado o Umm al-Qura puede diferir en 1–2 días. Antes del año 1 de la Hégira no da resultado.","lim_2":"El calendario persa se calcula astronómicamente (equinoccio de Meeus, mediodía en Teherán) para los años gregorianos 1001–2999; fuera de ese intervalo no da resultado.","lim_3":"El calendario chino usa la hora de Pekín (hora local media antes de 1929) y está comprobado con 26 fechas de Año Nuevo (1984–2034) y 21 meses intercalares (1984–2039); antes de 1645 es una extensión proléptica, no la historia oficial; fuera de los años gregorianos −1999 a 3000 no da resultado.","lim_4":"El calendario maya usa la correlación GMT (584283); en la literatura existen otras. El calendario hebreo es el aritmético (desde el año 1).","lim_5":"La fecha solar marciana se muestra para las 00:00 UT de la fecha elegida; ΔT se aproxima con p odossa romena passa le feste fisse al calendario giuliano riveduto (data da verificare nelle fonti primarie).","ro_unver":"non verificato","easter_h":"Pasqua nel {0}","easter_w":"Pasqua occidentale: {0}","easter_o":"Pasqua ortodossa: {0}","h_terms":"Termini solari cinesi {0}","terms_hint":"Data a Pechino (UTC+8) in cui il Sole raggiunge la longitudine indicata.","th_term":"Termine","th_lon":"Longitudine","th_date":"Data (gregoriano)","cny":"Capodanno cinese {0}: {1}","h_atlas":"Atlante dei calendari","atlas_note":"Una voce per calendario, dai file in data/calendars/. Le epoche sono numeri di giorno giuliano alle 0h.","th_name":"Calendario","th_region":"Regione","th_epoch":"Epoca (JD)","th_rule":"Regola degli anni bisestili","th_src":"Fonti","reg_gregorian":"tutto il mondo (civile)","reg_julian":"Europa (storico), Chiese ortodosse","reg_revised-julian":"Chiese ortodosse (feste fisse)","reg_hebrew":"ebraismo, Israele (religioso)","reg_hijri":"mondo islamico (religioso)","reg_persian":"Iran, Afghanistan","reg_coptic":"Egitto, Chiesa copta","reg_ethiopian":"Etiopia, Eritrea","reg_chinese":"Asia orientale (tradizionale)","reg_maya":"Mesoamerica (storico)","reg_mars":"Marte (missioni, ricerca)","rule_gregorian":"Bisestile se divisibile per 4, tranne i secoli, salvo se divisibile per 400.","rule_julian":"Bisestile se divisibile per 4.","rule_revised-julian":"Come il giuliano, ma i secoli sono bisestili solo se il resto modulo 900 è 200 o 600.","rule_hebrew":"Ciclo di 19 anni con 7 anni embolismici (un secondo Adar); lunghezza dell’anno fissata dalle regole di rinvio (dehiyyot).","rule_hijri":"Ciclo di 30 anni con 11 anni bisestili (2, 5, 7, 10, 13, 16, 18, 21, 24, 26, 29); mesi alterni di 30 e 29 giorni.","rule_persian":"L’anno inizia il giorno dell’equinozio di marzo se avviene prima di mezzogiorno a Teheran, altrimenti il giorno dopo; l’ultimo mese ha 29 o 30 giorni.","rule_coptic":"Bisestile se l’anno modulo 4 è 3 (un sesto giorno epagomeno).","rule_ethiopian":"Bisestile se l’anno modulo 4 è 3 (Pagume ha 6 giorni).","rule_chinese":"Luna nuova astronomica (Pechino); il mese 11 contiene il solstizio d’inverno; in un anno di 13 mesi il primo mese senza termine solare principale è intercalare.","rule_maya":"Conteggio dei giorni: 1 baktun = 144.000 giorni; Tzolk’in di 260 giorni; Haab’ di 365 giorni (18 × 20 + 5).","rule_mars":"Un sol = 1,0274912517 giorni terrestri; conteggio continuo, senza mesi.","h_limits":"Limiti, dichiarati con chiarezza","lim_1":"Il calendario egiriano è quello TABULARE (aritmetico); quello osservato o Umm al-Qura può differire di 1–2 giorni. Prima dell’anno 1 dell’Egira non dà risultato.","lim_2":"Il calendario persiano è calcolato astronomicamente (equinozio di Meeus, mezzogiorno a Teheran) per gli anni gregoriani 1001–2999; fuori da questo intervallo non dà risultato.","lim_3":"Il calendario cinese usa l’ora di Pechino (ora locale media prima del 1929) ed è verificato su 26 date di Capodanno (1984–2034) e 21 mesi intercalari (1984–2039); prima del 1645 è un’estensione prolettica, non la storia ufficiale; fuori dagli anni gregoriani da −1999 a 3000 non dà risultato.","lim_4":"Il calendario maya usa la correlazione GMT (584283); in letteratura ne esistono altre. Il calendario ebraico è quello aritmetico (dall’anno 1).","lim_5":"La data solare marziana è mostrata per le 00:00 UT della data scelta; ΔT è approssimato con polinomi (errore inferiore a un minuto tra il 1600 e il 2100; fuori da questo intervallo l’incertezza cresce).","lim_6":"Le date di adozione del calendario gregoriano fuori dalla Romania non sono incluse; quelle contrassegnate «non verificato» vanno confermate nelle fonti primarie."},"hu":{"nav":"Átváltó","title":"Naptárátváltó és atlasz","open":"Az átváltó megnyitása","intro":"Írjon be egy dátumot bármelyik naptárban, és nézze meg ugyanazt a napot az összes többiben. Minden a böngészőben fut, hálózat nélkül; semmi sem megy el sehova.","h_conv":"Dátum átváltása","lbl_cal":"Naptár","lbl_year":"Év",   const t = d + e + 114;
  return { year: y, month: Math.floor(t / 31), day: (t % 31) + 1 };
}
function orthodoxEasterGregorian(reg, y) {
  const j = easterJulianDate(y);
  return reg.gregorian.fromJD(reg.julian.toJD(j.year, j.month, j.day));
}

// În Vechiul Regat ultima zi civilă în stil vechi a fost 31 martie 1919 (= 13 aprilie 1919 gregorian); ziua următoare s-a numit 14 aprilie 1919.
const RO_EVENTS = [
  // cheia de text, data (în calendarul indicat), dacă data a fost verificată cu o sursă primară
  { key: 'ro_ev_1582', y: 1582, m: 10, d: 15, cal: 'gregorian', verified: true },
  { key: 'ro_ev_1919', y: 1919, m: 4, d: 14, cal: 'gregorian', verified: true },
  { key: 'ro_ev_1924', y: 1924, m: 10, d: 14, cal: 'gregorian', verified: false }
];
// diferența dintre etichetele iuliană și gregoriană pentru aceeași zi (zile)
function julianGregorianGap(reg, jd) {
  const j = reg.julian.fromJD(jd), g = reg.gregorian.fromJD(jd);
  const jj = reg.gregorian.toJD(j.year, j.month, j.day);   // eticheta iuliană citită ca gregoriană
  return Math.round(jj - reg.gregorian.toJD(g.year, g.month, g.day)) * -1;
}
function romanianStyle(reg, jd) {
  const oldDate = reg.julian.fromJD(jd), newDate = reg.gregorian.fromJD(jd);
  const civilIsOld = jd < reg.gregorian.toJD(1919, 4, 14);   // în Vechiul Regat, datele civile dinainte de 14 aprilie 1919 sunt în stil vechi
  return { civilIsOld, oldDate, newDate, gap: julianGregorianGap(reg, jd), revised: reg['revised-julian'] ? reg['revised-julian'].fromJD(jd) : null };
}

/* ---------- grila unei luni ---------- */
// întoarce zilele lunii (year, month) din calendarul id, cu eticheta zilei din calendarul secundar
function monthGrid(reg, id, year, month, leap, otherId) {
  const p = reg[id];
  if (!p || !isFinite(year) || !isFinite(month)) return null;
  const first = p.toJD(year, month, 1, leap);
  if (!isFinite(first)) return null;
  const days = [];
  for (let k = 0; k < 40; k++) {
    const jd = first + k;
    const d = p.fromJD(jd);
    if (d.year !== year || d.month !== month || !!d.leap !== !!leap && id === 'chinese') break;
    if (k > 0 && d.day === 1) break;
    const o0 = otherId && reg[otherId] ? reg[otherId].fromJD(jd) : null;
    const o = isValidDate(o0) ? o0 : null;
    days.push({ jd, day: d.day, other: o, wd: weekdayOf(jdnOf(jd)) });
  }
  if (!days.length) return null;
  return { first, days, startOffset: ((weekdayOf(jdnOf(first)) + 6) % 7) };
}
function parseLongCount(text) {
  const parts = String(text).trim().split(/[.\s,]+/).filter(Boolean).map(Number);
  if (parts.length < 1 || parts.length > 5 || parts.some(function (n) { return !isFinite(n) || Math.floor(n) !== n; })) return null;
  while (parts.length < 5) parts.unshift(0);
  return parts;
}

function tr(lang,key){var s=I18N[lang]&&I18N[lang][key];if(s==null)s=I18N.en[key];if(s==null)s=key;return s}
function fmt(s){var a=arguments;return String(s).replace(/\{(\d)\}/g,function(_,i){return a[+i+1]})}
/* CALENDARIUM · interfața. Folosește din ambalaj: PLUGINS, DATA, I18N, tr(), fmt() și funcțiile din engine.mjs. */
var STORE_KEY = 'calendarium.state';
var reg = PLUGINS;
var state = loadState();
var cur = { el: null, lang: 'en', L: null };
var grid = null;          // luna afișată în vederea lunară: {cal, y, m, leap}
var listCache = {};

function loadState() {
  var s = { jd: null, cal: 'gregorian', other: 'julian' };
  try {
    var raw = JSON.parse(localStorage.getItem(STORE_KEY));
    if (raw && typeof raw.jd === 'number' && isFinite(raw.jd) && raw.jd > JD_MIN && raw.jd < JD_MAX && ORDER.indexOf(raw.cal) >= 0) {
      s.jd = Math.floor(raw.jd + 0.5) - 0.5;
      s.cal = raw.cal;
      if (ORDER.indexOf(raw.other) >= 0 && gridable(raw.other)) s.other = raw.other;
    }
  } catch (e) { /* stocarea poate lipsi sau conține altceva */ }
  if (s.jd === null) s.jd = todayJD();
  return s;
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ jd: state.jd, cal: state.cal, other: state.other })); } catch (e) { /* ignorat */ } }
function todayJD() { var t = new Date(); return reg.gregorian.toJD(t.getFullYear(), t.getMonth() + 1, t.getDate()); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function makeL(lang) {
  function list(k) { var key = lang + '/' + k; if (!listCache[key]) listCache[key] = tr(lang, k).split('|'); return listCache[key]; }
  return {
    lang: lang,
    t: function (k) { return tr(lang, k); },
    list: list,
    month: function (m) { return list('mon')[m - 1]; },
    date: function (d, m, y) { return tr(lang, 'dfmt').replace('{d}', d).replace('{m}', m).replace('{y}', y); },
    mtitle: function (m, y) { return tr(lang, 'mfmt').replace('{m}', m).replace('{y}', y); },
    era: function (y) { return y >= 1 ? String(y) : (1 - y) + ' ' + tr(lang, 'bce'); }
  };
}
function fmtG(jd) { return reg.gregorian.format(reg.gregorian.fromJD(jd), cur.L); }
function fmtJ(jd) { return reg.julian.format(reg.julian.fromJD(jd), cur.L); }
function calName(id) { return cur.L.t('cal_' + id); }

/* ---------- câmpurile de intrare ---------- */
function fieldLabel(f) {
  var L = cur.L;
  if (f === 'year') return L.t('lbl_year');
  if (f === 'month') return L.t('lbl_month');
  if (f === 'day') return L.t('lbl_day');
  if (f === 'leap') return L.t('lbl_leap');
  if (f === 'msd') return L.t('lbl_msd');
  return f.charAt(0).toUpperCase() + f.slice(1);   // baktun, katun, tun, uinal, kin: nume proprii
}
function fieldValue(d, f) {
  var v = d ? d[f] : NaN;
  if (typeof v !== 'number' || !isFinite(v)) return '';
  return f === 'msd' ? v.toFixed(3) : String(v);
}
function monthOptions(id, year, selected) {
  var p = reg[id], list = p.monthList ? p.monthList(year, cur.L) : [];
  return list.map(function (o) { return '<option value="' + o.v + '"' + (o.v === selected ? ' selected' : '') + '>' + esc(o.n) + '</option>'; }).join('');
}
var CAUTION = { hebrew: 'lim_4', hijri: 'lim_1', persian: 'lim_2', chinese: 'lim_3', maya: 'lim_4', mars: 'lim_5' };
function renderCaution() {

}
function onPaste(ev) {
  if (state.cal !== 'maya' || !ev.clipboardData) return;
  var text = String(ev.clipboardData.getData('text') || '');
  var parts = text.indexOf('.') >= 0 ? parseLongCount(text) : null;

}
function renderFields() {
  var p = reg[state.cal], d = p.fromJD(state.jd), ok = isValidDate(d), html = '';
  p.fields.forEach(function (f) {
    var idf = 'cal-f-' + f, label = fieldLabel(f);
    if (f === 'month') html += '<label class="cal-f" for="' + idf + '"><span>' + esc(label) + '</span><select id="' + idf + '" class="sel cal-inp" data-f="month">' + monthOptions(state.cal, ok ? d.year : refYear(state.cal), ok ? d.month : -1) + '</select></label>';
    else if (f === 'leap') html += '<label class="cal-f cal-chk" for="' + idf + '"><input type="checkbox" id="' + idf + '" data-f="leap"' + (ok && d.leap ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
    else html += '<label class="cal-f" for="' + idf + '"><span>' + esc(label) + '</span><input type="number" step="' + (f === 'msd' ? 'any' : '1') + '" inputmode="' + (f === 'msd' ? 'decimal' : 'numeric') + '" id="' + idf + '" class="cal-inp" data-f="' + f + '" value="' + esc(ok ? fieldValue(d, f) : '') + '"></label>';
  });

}
function fillFields() {
  var p = reg[state.cal], d = p.fromJD(state.jd), ok = isValidDate(d);
  p.fields.forEach(function (f) {
    var e = cur.el.querySelector('#cal-f-' + f);
    if (!e) return;
    if (f === 'leap') e.checked = ok && !!d.leap;
    else if (f === 'month') { e.innerHTML = monthOptions(state.cal, ok ? d.year : refYear(state.cal), ok ? d.month : -1); if (ok) e.value = String(d.month); }
    else e.value = ok ? fieldValue(d, f) : '';
  });
  if (ok) setMessage('', false); else setMessage(fmt(cur.L.t('err_range'), calName(state.cal)), true);
}
function readFields() {
  var p = reg[state.cal], vals = [];
  p.fields.forEach(function (f) {
    var e = cur.el.querySelector('#cal-f-' + f);
    if (f === 'leap') { vals.push(!!(e && e.checked)); return; }
    var raw = e ? String(e.value).trim() : '';
    vals.push(raw === '' ? NaN : Number(raw));
  });
  return vals;
}
function setMessage(text, bad) {
  var m = cur.el.querySelector('#cal-msg');
  m.textContent = text || '';
  m.className = 'cal-msg' + (bad ? ' cal-bad' : '');
}
function onFieldsChange(ev) {
  var p = reg[state.cal];
  if (ev && ev.target && ev.target.getAttribute && ev.target.getAttribute('data-f') === 'year' && p.monthList) {
    var ms = cur.el.querySelector('#cal-f-month'), y = Number(ev.target.value);
    if (ms && ev.target.value !== '' && isFinite(y)) {
      var keep = ms.value;
      ms.innerHTML = monthOptions(state.cal, y, Number(keep));
      if (ms.querySelector('option[value="' + keep + '"]')) ms.value = keep; else ms.selectedIndex = 0;
    }
  }
  var vals = readFields();
  var bad = vals.some(function (v) { return typeof v === 'number' && !isFinite(v); }) ||
    vals.some(function (v, i) { return p.fields[i] !== 'msd' && typeof v === 'number' && Math.floor(v) !== v; });
  if (bad) { setMessage(cur.L.t('err_nan'), true); return; }
  var r = toJDChecked(reg, state.cal, vals);
  if (!r.ok) { setMessage(fmt(cur.L.t(r.why === 'range' ? 'err_range' : 'err_nodate'), calName(state.cal)), true); return; }
  setMessage('', false);
  state.jd = Math.floor(r.jd + 0.5) - 0.5;

/* ---------- vederea lunară ---------- */
function syncGridToState() {
  var id = gridable(state.cal) ? state.cal : 'gregorian';
  var d = reg[id].fromJD(state.jd);
  if (!isValidDate(d)) { id = 'gregorian'; d = reg.gregorian.fromJD(state.jd); }
  grid = { cal: id, y: d.year, m: d.month, leap: !!d.leap && id === 'chinese' };
}
function shortMonth(id, d) {
  var p = reg[id];
  if (id === 'gregorian' || id === 'julian' || id === 'revised-julian') return cur.L.month(d.month).slice(0, 3);
  if (id === 'hebrew') return p.monthName(d.year, d.month).slice(0, 5);
  return p.NAMES ? p.NAMES[d.month - 1].slice(0, 5) : '';
}
function otherLabel(other, od) {
  if (!od) return '';
  if (other === 'chinese') return (od.leap ? '+' : '') + od.month + '/' + od.day;
  return od.day + (od.day === 1 ? ' ' + shortMonth(other, od) : '');
}
function renderGrid() {
  var L = cur.L, host = document.getElementById('cal-gridbox');
  if (!host) return;
  if (!grid) syncGridToState();
  var other = state.other === grid.cal ? (grid.cal === 'gregorian' ? 'julian' : 'gregorian') : state.other;
  var g = monthGrid(reg, grid.cal, grid.y, grid.m, grid.leap, other);
  var opts = ORDER.filter(gridable).map(function (id) { return id === grid.cal ? '' : '<option value="' + id + '"' + (id === other ? ' selected' : '') + '>' + esc(calName(id)) + '</option>'; }).join('');
  var head = '<div class="cal-gridbar"><button type="button" class="btn" data-act="prev" aria-label="' + esc(L.t('prev')) + '">‹</button><strong class="cal-gtitle" id="cal-gtitle"></strong><button type="button" class="btn" data-act="next" aria-label="' + esc(L.t('next')) + '">›</button>' +
    '<label class="cal-f"><span>' + esc(L.t('lbl_other')) + '</span><select id="cal-other" class="sel cal-inp">' + opts + '</select></label></div>';
  if (!g) { host.innerHTML = head + '<p class="note">' + esc(L.t('na')) + '</p>'; return; }
  var gp = reg[grid.cal], title = gp.monthTitle ? gp.monthTitle(grid.y, grid.m, grid.leap, L) : gp.format({ year: grid.y, month: grid.m, day: 1, leap: grid.leap }, L);
  var wdn = L.list('wd'), heads = '', i, k;
  for (i = 0; i < 7; i++) heads += '<th scope="col"><abbr title="' + esc(wdn[(i + 1) % 7]) + '">' + esc(wdn[(i + 1) % 7].slice(0, 3)) + '</abbr></th>';
  var cells = '', rowsHtml = '', col = g.startOffset;
  for (k = 0; k < col; k++) cells += '<td class="cal-empty"></td>';
  g.days.forEach(function (day) {
    var sel = jdnOf(day.jd) === jdnOf(state.jd);
    cells += '<td><button type="button" class="cal-cell' + (sel ? ' cal-on' : '') + '" data-jd="' + day.jd + '"' + (sel ? ' aria-current="date"' : '') + '><span>' + day.day + '</span><small>' + esc(otherLabel(other, day.other)) + '</small></button></td>';
    col++;
    if (col === 7) { rowsHtml += '<tr>' + cells + '</tr>'; cells = ''; col = 0; }
  });
  if (cells) { for (k = col; k < 7; k++) cells += '<td class="cal-empty"></td>'; rowsHtml += '<tr>' + cells + '</tr>'; }
  host.innerHTML = head + '<div class="tblw"><table class="cal-grid"><caption class="cal-cap">' + esc(L.t('grid_hint')) + '</caption><thead><tr>' + heads + '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>';
  host.querySelector('#cal-gtitle').textContent = title;
}
function onGridClick(ev) {
  var t = ev.target.closest ? ev.target.closest('button') : null;
  if (!t) return;
  var act = t.getAttribute('data-act');
  if (act === 'prev' || act === 'next') {
    var g = monthGrid(reg, grid.cal, grid.y, grid.m, grid.leap, null);
    if (!g) return;
    var d = reg[grid.cal].fromJD(act === 'next' ? g.first + g.days.length : g.first - 1);
    if (!isValidDate(d)) return;
    grid = { cal: grid.cal, y: d.year, m: d.month, leap: !!d.leap && grid.cal === 'chinese' };
    renderGrid();
  } else if (t.getAttribute('data-jd')) {
    var jd = Number(t.getAttribute('data-jd'));
    if (!isFinite(jd)) return;
    state.jd = jd;
    saveState();
    fillFields();
    renderOutputs();
  }
}
